version: 2

before:
  hooks:
    # Builds the embedded dashboard fresh into internal/webui/dist/app (see
    # ui/vite.config.ts) before go:embed picks it up, so a release binary
    # always ships the real UI, never the "dashboard not built" fallback.
    # Requires Node - release.yml builds it explicitly first too, so this
    # is mainly for a local `goreleaser release`. Global before.hooks exec
    # directly with no shell (no "&&"/"cd"), and "sh" isn't guaranteed to
    # exist on Windows - "npm --prefix" avoids needing either.
    - npm --prefix ui ci
    - npm --prefix ui run build
    # Verify rather than tidy: a release must build exactly the committed
    # go.mod/go.sum, never a version of them rewritten mid-release.
    - go mod verify

builds:
  - id: local-swarm-mcp
    main: ./cmd/local-swarm-mcp
    binary: local-swarm-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Reproducible builds: no local paths in the binary, and file times
    # pinned to the commit.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: local-swarm-mcp
    ids: [local-swarm-mcp]
    name_template: "local-swarm-mcp_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.example.yaml
      - config.example.json

checksum:
  name_template: "checksums.txt"

# One SPDX SBOM per archive (generated by syft, which release.yml installs),
# published next to it in the release.
sboms:
  - artifacts: archive

# Keyless Sigstore signature over checksums.txt - which covers every
# archive - using the release workflow's GitHub OIDC identity. Produces
# checksums.txt.sigstore.json (signature + certificate bundle).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: jhonsferg
    name: local-swarm-mcp
  footer: |
    ## Verifying this release

    Every archive is listed in `checksums.txt`, which is signed with
    [Sigstore](https://www.sigstore.dev/) by this repository's release
    workflow, and each archive has a GitHub build-provenance attestation
    and an SPDX SBOM (`*.sbom.json`).

    ```sh
    # Git Bash on Windows rewrites the backslashes in the regex below
    # unless path conversion is off: export MSYS_NO_PATHCONV=1
    #
    # 1. the checksums file was produced by this repo's release workflow
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp '^https://github.com/jhonsferg/local-swarm-mcp/\.github/workflows/release\.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    # 2. your archive matches it
    sha256sum --ignore-missing -c checksums.txt
    # or, with the GitHub CLI, check the build provenance directly
    gh attestation verify local-swarm-mcp_linux_amd64.tar.gz --repo jhonsferg/local-swarm-mcp
    ```

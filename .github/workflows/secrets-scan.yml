name: Secrets Scan

# TruffleHog over the full git history (pushes) or the commits a pull
# request adds. Fails on verified secrets and on unverified ones that
# match a known credential format.
#
# Deliberately `pull_request`, never `pull_request_target`: the latter runs
# with write permissions and secrets against untrusted fork code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  trufflehog:
    # Name is a required status check on main - keep it in sync with the
    # branch protection settings.
    name: Scan for Secrets & Credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown

name: Secrets Scan

# TruffleHog over the full git history (pushes) or the commits a pull
# request adds. Fails on verified secrets and on unverified ones that
# match a known credential format.
#
# Deliberately `pull_request`, never `pull_request_target`: the latter runs
# with write permissions and secrets against untrusted fork code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan for secrets & credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified,unknown

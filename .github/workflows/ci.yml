name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the embedded dashboard (ui/, a Vue app) once and hands it to
  # every Go job below. The build output is never committed - only
  # internal/webui/dist/.gitkeep is - so without this artifact the Go jobs
  # would compile the "dashboard not built" fallback instead.
  ui:
    name: Build dashboard (ui/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Audit dependencies
        working-directory: ui
        run: npm audit --audit-level=high
      - name: Test
        working-directory: ui
        run: npm run test
      - name: Build
        working-directory: ui
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webui-dist
          path: internal/webui/dist/app
          if-no-files-found: error

  build:
    name: Build, Vet & Test
    needs: [ui]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webui-dist
          path: internal/webui/dist/app

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -covermode=atomic

  lint:
    name: golangci-lint
    needs: [ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webui-dist
          path: internal/webui/dist/app
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # keep in step with .golangci.yml

  govulncheck:
    # Name is a required status check on main - keep it in sync with the
    # branch protection settings.
    name: Dependency CVE Audit
    needs: [ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webui-dist
          path: internal/webui/dist/app
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  # Builds every release archive exactly as release.yml would (same
  # .goreleaser.yml, snapshot version, nothing published) so a broken
  # release config fails the PR instead of the release, and the binaries
  # can be downloaded from the run for manual testing.
  snapshot:
    name: Release build (snapshot)
    needs: [ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webui-dist
          path: internal/webui/dist/app
      - name: Check goreleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: Build snapshot archives
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          # The dashboard is already built (artifact above); signing and
          # SBOMs only happen for real releases.
          args: release --snapshot --clean --skip=before,sign,sbom
      - name: Verify the dashboard is embedded
        run: |
          out=$(./dist/local-swarm-mcp_linux_amd64_v1/local-swarm-mcp -version)
          echo "$out"
          echo "$out" | grep -q "dashboard embedded"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 14

  # Creates an annotated tag on the current HEAD and pushes it - no commit to
  # main is needed, so branch protection is never triggered.
  # Pushing the tag fires release.yml, which cross-compiles and publishes
  # binaries via goreleaser.
  #
  # Bump rules:
  #   feat!: / BREAKING CHANGE  -> major
  #   feat:                      -> minor
  #   fix: / perf: / refactor: / security:  -> patch
  #   docs: / chore: / ci:       -> no release
  auto-release:
    name: Auto Tag & Release
    needs: [build, lint, govulncheck, snapshot]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ── 1. Determine bump type from Conventional Commits ─────────────────
      - name: Determine version bump
        id: bump
        run: |
          set -euo pipefail

          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          [ -z "$LATEST_TAG" ] && LATEST_TAG="v0.0.0"
          echo "Latest tag: $LATEST_TAG"

          if git rev-parse "${LATEST_TAG}" >/dev/null 2>&1; then
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --format="%s %b")
          else
            COMMITS=$(git log --format="%s %b")
          fi

          echo "Commits since ${LATEST_TAG}:"
          echo "$COMMITS"

          BUMP="none"
          if echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING.CHANGE'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE '^(fix|perf|refactor|security)(\([^)]*\))?:'; then
            BUMP="patch"
          fi

          echo "Bump type: $BUMP"
          echo "bump=${BUMP}"             >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      # ── 2. Compute the new version number ─────────────────────────────────
      - name: Compute new version
        id: version
        if: steps.bump.outputs.bump != 'none'
        run: |
          LATEST="${{ steps.bump.outputs.latest_tag }}"
          VER="${LATEST#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)

          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      # ── 3. Create annotated tag and push it ────────────────────────────────
      #
      # Pushing a tag does not touch any branch, so branch protection rules
      # are not involved.
      #
      # NOTE: GITHUB_TOKEN tag pushes do not trigger downstream workflows
      # (GitHub anti-loop policy). release.yml is dispatched explicitly in
      # the next step instead of relying on the push event.
      - name: Create and push version tag
        if: steps.bump.outputs.bump != 'none'
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release ${NEW_TAG}"
          git push origin "$NEW_TAG"
          echo "Tag ${NEW_TAG} pushed"

      # ── 4. Dispatch release.yml for the new tag ────────────────────────────
      #
      # GITHUB_TOKEN tag pushes do not fire push.tags triggers in other
      # workflows. Dispatch explicitly so the release build runs.
      - name: Dispatch release workflow
        if: steps.bump.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "$NEW_TAG"

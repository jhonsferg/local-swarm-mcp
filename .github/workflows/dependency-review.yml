name: Dependency Review

# On every pull request, checks the dependencies it adds or changes (Go,
# npm, and GitHub Actions) against the GitHub Advisory Database and a
# license allowlist, and summarizes the result in a PR comment. Fails on
# HIGH or CRITICAL advisories, or on a license outside the list.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review changed dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Permissive licenses compatible with this MIT project. The
          # LicenseRef is the additional patent grant (PATENTS file) that
          # ships with Go's own golang.org/x/* modules alongside BSD-3-Clause.
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            MPL-2.0, Unlicense, CC0-1.0, CC-BY-4.0, BlueOak-1.0.0, Python-2.0,
            LicenseRef-scancode-google-patent-license-golang
          # CI-only tooling: these actions run on GitHub's runners and are
          # never distributed with local-swarm-mcp, so their licenses don't
          # apply to it.
          allow-dependencies-licenses: >-
            pkg:githubactions/trufflesecurity/trufflehog
          comment-summary-in-pr: on-failure

name: Release

# Builds every binary on GitHub's runners and publishes it to the GitHub
# release for the tag: archives for linux/darwin/windows x amd64/arm64,
# checksums.txt with a keyless Sigstore signature, one SPDX SBOM per
# archive, and a build-provenance attestation per artifact. Triggered by a
# pushed v* tag, or dispatched by ci.yml's auto-release job for the tag it
# just created.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # Sigstore keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Builds into internal/webui/dist/app (see ui/vite.config.ts), which
      # go:embed picks up - the build output is never committed, so this
      # step is what puts the real dashboard into release binaries.
      - name: Build embedded dashboard (ui/)
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          test -f ../internal/webui/dist/app/index.html

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Install cosign (signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published binary embeds the dashboard
        run: |
          out=$(./dist/local-swarm-mcp_linux_amd64_v1/local-swarm-mcp -version)
          echo "$out"
          echo "$out" | grep -q "dashboard embedded"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
